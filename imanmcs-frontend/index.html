    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#16a34a" />
    <meta name="msapplication-TileColor" content="#16a34a" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "IMAN Multi-Purpose Cooperative Society",
            "description": "A Sharia-compliant cooperative platform for healthcare professionals.",
            "url": "https://imancooperative.vercel.app/"
          },
          {
            "@type": "WebSite",
            "name": "IMAN Cooperative",
            "url": "https://imancooperative.vercel.app/"
          }
        ]
      }
    </script>

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored === 'dark' || stored === 'light' ? stored : 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = theme === 'dark' || (theme === 'system' && prefersDark);
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
