version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cooperative_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cooperate_secure_password_2026}
      POSTGRES_DB: ${DB_NAME:-imanmcs_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bound to localhost only (secure, accessible for local pg_dump backups)
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-imanmcs_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cooperative_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-cooperate_secure_password_2026}
      DB_NAME: ${DB_NAME:-imanmcs_db}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-cooperative_super_secret_jwt_key_min_32_characters_long}
      APP_URL: ${APP_URL:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      MEMBER_PORTAL_URL: ${MEMBER_PORTAL_URL:-${FRONTEND_URL:-https://www.fmcksmcs.com}}
      ADMIN_PORTAL_URL: ${ADMIN_PORTAL_URL:-${FRONTEND_URL:-https://www.fmcksmcs.com}}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      EMAIL_DEBUG: ${EMAIL_DEBUG:-false}
      EMAIL_HOST: ${EMAIL_HOST:-${SMTP_HOST:-smtp.gmail.com}}
      EMAIL_PORT: ${EMAIL_PORT:-${SMTP_PORT:-587}}
      EMAIL_SECURE: ${EMAIL_SECURE:-${SMTP_SECURE:-}}
      EMAIL_USER: ${EMAIL_USER:-${SMTP_USER:-fmcksmcs@gmail.com}}
      EMAIL_PASS: ${EMAIL_PASS:-${SMTP_PASSWORD:-${SMTP_PASS:-}}}
      EMAIL_FROM: ${EMAIL_FROM:-${SMTP_FROM:-fmcksmcs@gmail.com}}
      SMTP_HOST: ${SMTP_HOST:-${EMAIL_HOST:-smtp.gmail.com}}
      SMTP_PORT: ${SMTP_PORT:-${EMAIL_PORT:-587}}
      SMTP_SECURE: ${SMTP_SECURE:-${EMAIL_SECURE:-}}
      SMTP_USER: ${SMTP_USER:-${EMAIL_USER:-fmcksmcs@gmail.com}}
      SMTP_PASS: ${SMTP_PASS:-${SMTP_PASSWORD:-${EMAIL_PASS:-}}}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-${SMTP_PASS:-${EMAIL_PASS:-}}}
      SMTP_FROM: ${SMTP_FROM:-${EMAIL_FROM:-fmcksmcs@gmail.com}}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-${EMAIL_FROM_NAME:-FMCK SMCS}}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-${SMTP_FROM_NAME:-FMCK SMCS}}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-fmcksmcs@gmail.com}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-+234 810 588 0201}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
    volumes:
      - backend_uploads:/app/uploads
    ports:
      # Backend direct API port
      - "3001:3001"

  frontend:
    build:
      context: ./imanmcs-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: cooperative_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro

volumes:
  postgres_data:
    name: cooperative_postgres_data
  backend_uploads:
    name: cooperative_backend_uploads
  certbot_www:
    name: cooperative_certbot_www
  certbot_conf:
    name: cooperative_certbot_conf
